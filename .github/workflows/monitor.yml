
name: Monitor CarteMagic TCG

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-cartemagic
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: python -m pip install requests beautifulsoup4

      - name: Controlla CarteMagic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lo stato dei prodotti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_products.json .baseline_initialized
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna storico monitor CarteMagic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
